<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IPTV Player</title>
    <!-- HLS Video Player Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background-color: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        h1 { font-size: 1.2rem; color: #38bdf8; }
        .status { font-size: 0.85rem; padding: 4px 10px; border-radius: 4px; background-color: #ca8a04; color: #fff; }
        .status.active { background-color: #16a34a; }

        .player-container { display: flex; flex: 1; height: calc(100vh - 50px); }
        
        /* Sol Menü: Kanal / Film Listesi */
        .sidebar { width: 320px; background-color: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .tabs { display: flex; border-bottom: 1px solid #334155; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #94a3b8; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .tab-btn.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; background-color: #0f172a; }
        
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-item { padding: 10px; margin-bottom: 5px; background-color: #0f172a; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .channel-item:hover { background-color: #0284c7; }

        /* Sağ Taraf: Video Oynatıcı */
        .main-player { flex: 1; background-color: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; height: 100%; max-height: 100%; object-fit: contain; }
        .overlay-loader { position: absolute; color: #38bdf8; font-size: 1.1rem; }
    </style>
</head>
<body>

    <header>
        <h1>Web IPTV Player</h1>
        <div id="status" class="status">Sunucu Aranıyor...</div>
    </header>

    <div class="player-container">
        <!-- Sol Panel -->
        <div class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('live')">Canlı TV</button>
                <button class="tab-btn" onclick="switchTab('movies')">Filmler</button>
                <button class="tab-btn" onclick="switchTab('series')">Diziler</button>
            </div>
            <div id="channel-list" class="channel-list">
                <div style="color: #64748b; text-align: center; margin-top: 20px;">Listeler yükleniyor...</div>
            </div>
        </div>

        <!-- Oynatıcı Panel -->
        <div class="main-player">
            <div id="loader" class="overlay-loader">Çalışan Sunucuya Bağlanılıyor...</div>
            <video id="video" controls autoplay></video>
        </div>
    </div>

    <script>
        const DOMAINS = [
            "tekno072.xyz:2095", "vip-flying.xyz:2095", "mrtrb.xyz:2095", "4kblue8k.xyz:2095",
            "maxgoldx.xyz:2095", "ediztv.yeninesiltv.org:2095", "euteck.xyz:2095", "4kx8k.xyz:2095"
        ];

        const ACCOUNTS = [
            { username: "1879387Tobias", password: "d87a6d553670afb6" },
            { username: "efeece", password: "jYaK4ad" },
            { username: "Marvin.", password: "fzAT3ebxRZ" },
            { username: "GurEyup5858", password: "pF1zg8n2" }
        ];

        let activeDomain = "";
        let activeAccount = null;
        let hls = null;

        document.addEventListener("DOMContentLoaded", initPlayer);

        async function initPlayer() {
            const statusEl = document.getElementById("status");
            const loaderEl = document.getElementById("loader");

            // Çalışan ilk domaini ayarla
            activeDomain = DOMAINS[0];
            activeAccount = ACCOUNTS[0];

            statusEl.textContent = "Aktif: " + activeDomain;
            statusEl.className = "status active";
            loaderEl.style.display = "none";

            // Örnek Test Listesini Yükle (Canlı TV, Film, Dizi)
            loadDemoChannels();
        }

        const sampleChannels = {
            live: [
                { name: "TRT 1 HD", streamId: "trt1" },
                { name: "ATV HD", streamId: "atv" },
                { name: "Kanal D HD", streamId: "kanald" },
                { name: "TV8 HD", streamId: "tv8" },
                { name: "BeIN Sports 1", streamId: "bs1" }
            ],
            movies: [
                { name: "Aksiyon Filmi 1 (1080p)", streamId: "movie1" },
                { name: "Komedi Filmi 2", streamId: "movie2" }
            ],
            series: [
                { name: "Yerli Dizi S01E01", streamId: "series1" }
            ]
        };

        let currentCategory = 'live';

        function loadDemoChannels() {
            const container = document.getElementById("channel-list");
            container.innerHTML = "";

            const items = sampleChannels[currentCategory] || [];
            items.forEach(ch => {
                const div = document.createElement("div");
                div.className = "channel-item";
                div.textContent = ch.name;
                div.onclick = () => playStream(ch.streamId);
                container.appendChild(div);
            });
        }

        function switchTab(type) {
            currentCategory = type;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadDemoChannels();
        }

        function playStream(streamId) {
            const video = document.getElementById('video');
            // IPTV yayın adresi kalıbı
            const streamUrl = `http://${activeDomain}/live/${activeAccount.username}/${activeAccount.password}/${streamId}.m3u8`;

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play();
            }
        }
    </script>
</body>
</html>
