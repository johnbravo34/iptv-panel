<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV M3U Bağlantı Paneli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #38bdf8;
            font-size: 1.5rem;
        }
        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card h2 {
            margin-bottom: 12px;
            font-size: 1.1rem;
            color: #94a3b8;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 8px;
        }
        button:hover {
            background-color: #0369a1;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .badge.success { background-color: #16a34a; color: white; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IPTV Bağlantı Paneli</h1>
        
        <div class="card">
            <h2>Aktif Sunucu Durumu</h2>
            <p style="margin-bottom: 8px;">Seçili Sunucu: <strong id="active-domain">---</strong></p>
            <p>Durum: <span id="status-badge" class="badge success">Aktif</span></p>
        </div>

        <div class="card">
            <h2>M3U Link Üretici</h2>
            <div class="form-group">
                <label for="user-select">Kullanıcı Hesabı Seçin:</label>
                <select id="user-select" onchange="generateUserM3u()"></select>
            </div>
            <div class="form-group">
                <label for="m3u-output">Otomatik Oluşturulan M3U Linki:</label>
                <input type="text" id="m3u-output" readonly>
                <button onclick="copyLink()">Linki Kopyala</button>
            </div>
        </div>
    </div>

        document.addEventListener("DOMContentLoaded", () => {
            initAccountSelect();

        });

        function initAccountSelect() {
            const select = document.getElementById("user-select");
            ACCOUNTS.forEach((acc, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = acc.username;
                select.appendChild(option);
            });
        }

        function initApp() {
            const defaultDomain = DOMAINS[0];
            document.getElementById("active-domain").textContent = defaultDomain;
            generateUserM3u();
        }

        function generateUserM3u() {
            const select = document.getElementById("user-select");
            const output = document.getElementById("m3u-output");
            const selectedAcc = ACCOUNTS[select.value];
            const activeDomain = DOMAINS[0];

            const m3uUrl = `http://${activeDomain}/get.php?username=${selectedAcc.username}&password=${selectedAcc.password}&type=m3u_plus`;
            output.value = m3uUrl;
        }

        function copyLink() {
            const copyText = document.getElementById("m3u-output");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("M3U Linki kopyalandı!");
        }
    </script>
</body>
</html>
