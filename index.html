<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IPTV Player - Akıllı Sunucu Testi</title>
    <!-- HLS Video Player Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background-color: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; gap: 10px; }
        h1 { font-size: 1.1rem; color: #38bdf8; white-space: nowrap; }
        
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .status { font-size: 0.85rem; padding: 6px 12px; border-radius: 4px; background-color: #ca8a04; color: #fff; font-weight: bold; }
        .status.active { background-color: #16a34a; }

        .switch-btn { background-color: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.2s; }
        .switch-btn:hover { background-color: #0369a1; }
        .switch-btn:disabled { background-color: #475569; cursor: not-allowed; }

        .player-container { display: flex; flex: 1; height: calc(100vh - 60px); }
        
        /* Sol Menü */
        .sidebar { width: 300px; background-color: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .tabs { display: flex; border-bottom: 1px solid #334155; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #94a3b8; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .tab-btn.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; background-color: #0f172a; }
        
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-item { padding: 12px; margin-bottom: 6px; background-color: #0f172a; border-radius: 6px; cursor: pointer; font-size: 0.9rem; border: 1px solid #334155; transition: 0.2s; }
        .channel-item:hover { background-color: #0284c7; border-color: #38bdf8; }

        /* Sağ Taraf: Video Player */
        .main-player { flex: 1; background-color: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; height: 100%; max-height: 100%; object-fit: contain; }
        
        .info-bar { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.85); padding: 8px 14px; border-radius: 6px; font-size: 0.8rem; color: #cbd5e1; z-index: 10; }
    </style>
</head>
<body>

    <header>
        <h1>Web IPTV Player</h1>
        <div class="header-controls">
            <button id="switch-btn" class="switch-btn" onclick="autoSwitchServer()" disabled>🔄 Çalışan Sunucuyu Değiştir</button>
            <div id="status" class="status">Kombinasyonlar Test Ediliyor...</div>
        </div>
    </header>

    <div class="player-container">
        <!-- Sol Panel -->
        <div class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('live')">Canlı TV</button>
                <button class="tab-btn" onclick="switchTab('movies')">Filmler</button>
                <button class="tab-btn" onclick="switchTab('series')">Diziler</button>
            </div>
            <div id="channel-list" class="channel-list"></div>
        </div>

        <!-- Oynatıcı Panel -->
        <div class="main-player">
            <div class="info-bar" id="current-stream-info">Arka planda sunucular doğrulanıyor...</div>
            <video id="video" controls autoplay></video>
        </div>
    </div>

    <script>
        const DOMAINS = [
            "tekno072.xyz:2095", "vip-flying.xyz:2095", "mrtrb.xyz:2095", "4kblue8k.xyz:2095",
            "maxgoldx.xyz:2095", "ediztv.yeninesiltv.org:2095", "euteck.xyz:2095", "xx1907xx.mysynology.net:2095",
            "globalvip.yeninesiltv.live:2095", "4kx8k.xyz:2095", "dzcvip1.xyz:2095", "vip2fun.xyz:2095",
            "eurvip.xyz:2095", "frkavrptv.com:2095", "germanyblue.site:8080", "erolelektronik.store:8080",
            "isktv10.com:2095", "iptvturkie.xyz:8080", "izmiruydu.xyz:2095", "ikrtvnew.com:2095",
            "ward2026.store:8080", "ctn34.xyz:8080", "dpsmartone.xyz:2095", "eagleblue.store:2095"
        ];

        const ACCOUNTS = [
            { username: "1879387Tobias", password: "d87a6d553670afb6" },
            { username: "efeece", password: "jYaK4ad" },
            { username: "Marvin.", password: "fzAT3ebxRZ" },
            { username: "Meral.keh", password: "y4k61BsQ5G" },
            { username: "GurEyup5858", password: "pF1zg8n2" }
        ];

        let workingServers = []; // Sadece testten geçen aktif sunucu+hesap eşleşmeleri
        let activeServerIndex = 0;
        let selectedStreamId = null;
        let hls = null;

        const channels = {
            live: [
                { name: "TRT 1 HD", id: "trt1" },
                { name: "ATV HD", id: "atv" },
                { name: "Kanal D HD", id: "kanald" },
                { name: "TV8 HD", id: "tv8" },
                { name: "Show TV HD", id: "showtv" },
                { name: "BeIN Sports 1", id: "bs1" }
            ],
            movies: [
                { name: "Aksiyon Filmi (1080p)", id: "movie1" },
                { name: "Komedi Filmi", id: "movie2" }
            ],
            series: [
                { name: "Yerli Dizi S01E01", id: "series1" }
            ]
        };

        let currentCategory = 'live';

        document.addEventListener("DOMContentLoaded", async () => {
            renderChannels();
            await scanAndFilterServers();
        });

        // 1. AŞAMA: Sunucu ve Hesap Kombinasyonlarını Önceden Test Etme
        async function scanAndFilterServers() {
            const statusEl = document.getElementById("status");
            const infoEl = document.getElementById("current-stream-info");

            let testedCount = 0;
            const totalCombos = DOMAINS.length * ACCOUNTS.length;

            for (const domain of DOMAINS) {
                for (const acc of ACCOUNTS) {
                    testedCount++;
                    statusEl.textContent = `Test Ediliyor: ${testedCount}/${totalCombos}`;
                    
                    const isAlive = await testConnection(domain, acc);
                    if (isAlive) {
                        workingServers.push({ domain, acc });
                    }
                }
            }

            // Test Bitti
            if (workingServers.length > 0) {
                statusEl.textContent = `Aktif Sunucu: ${workingServers.length} Adet`;
                statusEl.classList.add("active");
                document.getElementById("switch-btn").disabled = false;
                infoEl.textContent = "Çalışan sunucular tespit edildi. Lütfen izlemek istediğiniz kanalı seçin.";
                updateActiveServerDisplay();
            } else {
                statusEl.textContent = "Çalışan Sunucu Bulunamadı!";
                statusEl.style.backgroundColor = "#dc2626";
                infoEl.textContent = "CORS veya Bağlantı Engeli nedeniyle sunuculara ulaşılamadı.";
            }
        }

        // Hızlı Ping / İstek Testi
        function testConnection(domain, acc) {
            return new Promise((resolve) => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000); // 2 saniye zaman aşımı

                // İsteği atmak için örnek yayın adresi
                fetch(`http://${domain}/live/${acc.username}/${acc.password}/trt1.m3u8`, {
                    method: 'HEAD',
                    mode: 'no-cors',
                    signal: controller.signal
                })
                .then(() => {
                    clearTimeout(timeoutId);
                    resolve(true); // Yanıt veren sunucu
                })
                .catch(() => {
                    clearTimeout(timeoutId);
                    resolve(false); // Yanıt vermeyen pasif sunucu
                });
            });
        }

        function updateActiveServerDisplay() {
            if (workingServers.length === 0) return;
            const current = workingServers[activeServerIndex];
            document.getElementById("status").textContent = `Aktif: ${current.domain} (${activeServerIndex + 1}/${workingServers.length})`;
        }

        // 2. AŞAMA: Sadece Çalışan Havuz İçinde Döndürme
        function autoSwitchServer() {
            if (workingServers.length === 0) return;

            // Sıradaki çalışan sunucuya geç
            activeServerIndex = (activeServerIndex + 1) % workingServers.length;
            updateActiveServerDisplay();

            if (selectedStreamId) {
                playStream(selectedStreamId);
            }
        }

        function renderChannels() {
            const container = document.getElementById("channel-list");
            container.innerHTML = "";

            const items = channels[currentCategory] || [];
            items.forEach(ch => {
                const div = document.createElement("div");
                div.className = "channel-item";
                div.textContent = ch.name;
                div.onclick = () => {
                    selectedStreamId = ch.id;
                    document.getElementById("current-stream-info").textContent = "Oynatılıyor: " + ch.name;
                    playStream(ch.id);
                };
                container.appendChild(div);
            });
        }

        function switchTab(type) {
            currentCategory = type;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderChannels();
        }

        function playStream(streamId) {
            if (workingServers.length === 0) {
                alert("Henüz çalışan bir sunucu tespit edilemedi veya sunucular kapalı.");
                return;
            }

            const video = document.getElementById('video');
            const current = workingServers[activeServerIndex];

            const streamUrl = `http://${current.domain}/live/${current.acc.username}/${current.acc.password}/${streamId}.m3u8`;

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({
                    manifestLoadingTimeOut: 4000,
                    fragLoadingTimeOut: 4000
                });
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        document.getElementById("current-stream-info").textContent = "Yayın Yüklenemedi. Otomatik olarak sonraki çalışan sunucu deneniyor...";
                        autoSwitchServer(); // Hata verirse takılmadan diğer çalışan sunucuya sıçra
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play();
            }
        }
    </script>
</body>
</html>
