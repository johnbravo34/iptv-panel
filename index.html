<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otomatik M3U Bağlantı Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; }
        h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 1.4rem; }
        .card { background-color: #1e293b; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .status-box { margin-bottom: 15px; padding: 12px; border-radius: 6px; background-color: #0f172a; font-size: 0.9rem; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; display: inline-block; margin-top: 5px; }
        .badge.success { background-color: #16a34a; color: white; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: #38bdf8; font-weight: bold; margin-top: 10px; font-size: 0.85rem; word-break: break-all; }
        button { background-color: #0284c7; color: white; border: none; padding: 14px; border-radius: 6px; width: 100%; font-weight: bold; margin-top: 12px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0369a1; }
        .alt-btn { background-color: #475569; margin-top: 8px; font-size: 0.85rem; padding: 10px; }
        .protocol-btn { background-color: #d97706; margin-top: 8px; font-size: 0.85rem; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Otomatik IPTV Link Paneli</h1>
        
        <div class="card">
            <div class="status-box">
                <p>Aktif Sunucu: <strong id="domain-text">---</strong></p>
                <p>Protokol: <strong id="protocol-text" style="color:#f59e0b;">HTTP</strong></p>
                <span class="badge success">Bağlantı Hazır</span>
            </div>

            <label>M3U Linkiniz:</label>
            <input type="text" id="m3u-output" readonly>
            
            <button onclick="copyLink()">M3U Linkini Kopyala</button>
            <button class="protocol-btn" onclick="toggleProtocol()">Protokol Değiştir (HTTP / HTTPS)</button>
            <button class="alt-btn" onclick="nextDomain()">Sonraki Sunucu / Hesabı Dene</button>
        </div>
    </div>

    <script>
        const DOMAINS = [
            "tekno072.xyz:2095", "vip-flying.xyz:2095", "mrtrb.xyz:2095", "4kblue8k.xyz:2095",
            "maxgoldx.xyz:2095", "ediztv.yeninesiltv.org:2095", "euteck.xyz:2095", "xx1907xx.mysynology.net:2095",
            "globalvip.yeninesiltv.live:2095", "4kx8k.xyz:2095", "dzcvip1.xyz:2095", "vip2fun.xyz:2095",
            "eurvip.xyz:2095", "frkavrptv.com:2095", "germanyblue.site:8080", "erolelektronik.store:8080",
            "isktv10.com:2095", "iptvturkie.xyz:8080", "izmiruydu.xyz:2095", "ikrtvnew.com:2095",
            "ward2026.store:8080", "ctn34.xyz:8080", "dpsmartone.xyz:2095", "eagleblue.store:2095"
        ];

        const ACCOUNTS = [
            { username: "1879387Tobias", password: "d87a6d553670afb6" },
            { username: "efeece", password: "jYaK4ad" },
            { username: "Marvin.", password: "fzAT3ebxRZ" },
            { username: "Meral.keh", password: "y4k61BsQ5G" },
            { username: "GurEyup5858", password: "pF1zg8n2" }
        ];

        let domainIndex = 0;
        let accountIndex = 0;
        let useHttps = false;

        document.addEventListener("DOMContentLoaded", () => {
            updateM3uLink();
        });

        function updateM3uLink() {
            const currentDomain = DOMAINS[domainIndex];
            const currentAcc = ACCOUNTS[accountIndex];
            const protocol = useHttps ? "https" : "http";
            
            document.getElementById("domain-text").textContent = currentDomain;
            document.getElementById("protocol-text").textContent = protocol.toUpperCase();

            const m3uUrl = `${protocol}://${currentDomain}/get.php?username=${currentAcc.username}&password=${currentAcc.password}&type=m3u_plus`;
            document.getElementById("m3u-output").value = m3uUrl;
        }

        function toggleProtocol() {
            useHttps = !useHttps;
            updateM3uLink();
        }

        function nextDomain() {
            domainIndex = (domainIndex + 1) % DOMAINS.length;
            if (domainIndex === 0) {
                accountIndex = (accountIndex + 1) % ACCOUNTS.length;
            }
            updateM3uLink();
        }

        function copyLink() {
            const copyText = document.getElementById("m3u-output");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("M3U Linki Kopyalandı!");
        }
    </script>
</body>
</html>
