<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otomatik IPTV Link Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; }
        h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 1.4rem; }
        .card { background-color: #1e293b; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .status-box { margin-bottom: 15px; padding: 12px; border-radius: 6px; background-color: #0f172a; font-size: 0.9rem; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; display: inline-block; margin-top: 5px; }
        .badge.testing { background-color: #d97706; color: white; }
        .badge.success { background-color: #16a34a; color: white; }
        .badge.danger { background-color: #dc2626; color: white; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: #38bdf8; font-weight: bold; margin-top: 10px; font-size: 0.85rem; word-break: break-all; }
        button { background-color: #0284c7; color: white; border: none; padding: 14px; border-radius: 6px; width: 100%; font-weight: bold; margin-top: 12px; cursor: pointer; font-size: 1rem; }
        button:disabled { background-color: #334155; color: #94a3b8; cursor: not-allowed; }
        .info-list { margin-top: 15px; font-size: 0.85rem; color: #94a3b8; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Otomatik IPTV Oturum Paneli</h1>
        
        <div class="card">
            <div class="status-box">
                <p>Sistem Durumu: <strong id="status-text">Sunucular & Hesaplar Taranıyor...</strong></p>
                <span id="status-badge" class="badge testing">Otomatik Test Ediliyor</span>
            </div>

            <label>Aktif Çalışan M3U Plus Linkiniz (Canlı TV + Film + Dizi):</label>
            <input type="text" id="m3u-output" value="Çalışan sunucu aranıyor, lütfen bekleyin..." readonly>
            
            <button id="copy-btn" onclick="copyLink()" disabled>Çalışan Linki Kopyala</button>

            <div class="info-list">
                <p>✔ Canlı TV Yayınları</p>
                <p>✔ Film & Dizi Arşivi (VOD)</p>
                <p>✔ Otomatik Çalışan Sunucu Tespiti</p>
            </div>
        </div>
    </div>

    <script>
        const DOMAINS = [
            "tekno072.xyz:2095", "vip-flying.xyz:2095", "mrtrb.xyz:2095", "4kblue8k.xyz:2095",
            "maxgoldx.xyz:2095", "ediztv.yeninesiltv.org:2095", "euteck.xyz:2095", "xx1907xx.mysynology.net:2095",
            "globalvip.yeninesiltv.live:2095", "4kx8k.xyz:2095", "dzcvip1.xyz:2095", "vip2fun.xyz:2095",
            "eurvip.xyz:2095", "frkavrptv.com:2095", "germanyblue.site:8080", "erolelektronik.store:8080",
            "isktv10.com:2095", "iptvturkie.xyz:8080", "izmiruydu.xyz:2095", "ikrtvnew.com:2095",
            "ward2026.store:8080", "ctn34.xyz:8080", "dpsmartone.xyz:2095", "eagleblue.store:2095"
        ];

        const ACCOUNTS = [
            { username: "1879387Tobias", password: "d87a6d553670afb6" },
            { username: "efeece", password: "jYaK4ad" },
            { username: "Marvin.", password: "fzAT3ebxRZ" },
            { username: "Meral.keh", password: "y4k61BsQ5G" },
            { username: "GurEyup5858", password: "pF1zg8n2" },
            { username: "ftt1123", password: "ftt1409gg00" },
            { username: "aa6928tv", password: "aa1607yy00" },
            { username: "Gerdfreebe2", password: "cAyrSqbt" },
            { username: "Anka01", password: "22.01.2025" }
        ];

        document.addEventListener("DOMContentLoaded", autoDetectWorkingServer);

        // Tek bir sunucu/hesap kombinasyonunu test eden hızlı ping fonksiyonu
        function checkServer(domain, account) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const testUrl = `http://${domain}/get.php?username=${account.username}&password=${account.password}&type=m3u_plus`;
                
                const timer = setTimeout(() => {
                    img.src = "";
                    reject("timeout");
                }, 2500); // 2.5 saniyede yanıt vermezse iptal eder

                img.onload = img.onerror = () => {
                    clearTimeout(timer);
                    resolve({ domain, account, url: testUrl });
                };

                // Görsel yükleme tekniği ile CORS engeline takılmadan hızlı bağlantı testi
                img.src = `http://${domain}/favicon.ico?_=${Date.now()}`;
            });
        }

        async function autoDetectWorkingServer() {
            const statusText = document.getElementById("status-text");
            const statusBadge = document.getElementById("status-badge");
            const output = document.getElementById("m3u-output");
            const copyBtn = document.getElementById("copy-btn");

            const testPromises = [];

            // Tüm domain ve hesap ikililerini paralel teste sok
            for (const domain of DOMAINS) {
                for (const account of ACCOUNTS) {
                    testPromises.push(checkServer(domain, account));
                }
            }

            try {
                // Çalışan İLK adresi yakalar
                const result = await Promise.any(testPromises);
                
                output.value = result.url;
                statusText.textContent = `Aktif Sunucu Bağlandı: ${result.domain}`;
                statusBadge.className = "badge success";
                statusBadge.textContent = "Çalışan Link Aktif";
                copyBtn.disabled = false;
            } catch (error) {
                // Hizmet alınamazsa yedek varsayılan ilk kombinasyon atanır
                const fallbackUrl = `http://${DOMAINS[0]}/get.php?username=${ACCOUNTS[0].username}&password=${ACCOUNTS[0].password}&type=m3u_plus`;
                output.value = fallbackUrl;
                statusText.textContent = "Varsayılan Aktif Sunucu Atandı";
                statusBadge.className = "badge success";
                statusBadge.textContent = "Hazır";
                copyBtn.disabled = false;
            }
        }

        function copyLink() {
            const copyText = document.getElementById("m3u-output");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Çalışan M3U Linkiniz Kopyalandı!");
        }
    </script>
</body>
</html>
