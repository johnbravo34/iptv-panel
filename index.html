<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background-color: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; gap: 10px; }
        h1 { font-size: 1.1rem; color: #38bdf8; white-space: nowrap; }
        
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .status { font-size: 0.85rem; padding: 6px 12px; border-radius: 4px; background-color: #0284c7; color: #fff; font-weight: bold; }

        .switch-btn { background-color: #16a34a; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.2s; }
        .switch-btn:hover { background-color: #15803d; }

        .player-container { display: flex; flex: 1; height: calc(100vh - 60px); }
        
        .sidebar { width: 300px; background-color: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .tabs { display: flex; border-bottom: 1px solid #334155; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #94a3b8; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .tab-btn.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; background-color: #0f172a; }
        
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-item { padding: 12px; margin-bottom: 6px; background-color: #0f172a; border-radius: 6px; cursor: pointer; font-size: 0.9rem; border: 1px solid #334155; transition: 0.2s; }
        .channel-item:hover { background-color: #0284c7; border-color: #38bdf8; }

        .main-player { flex: 1; background-color: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; height: 100%; max-height: 100%; object-fit: contain; }
        
        .info-bar { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.85); padding: 8px 14px; border-radius: 6px; font-size: 0.8rem; color: #cbd5e1; z-index: 10; }
    </style>
</head>
<body>

    <header>
        <h1>Web IPTV Player</h1>
        <div class="header-controls">
            <button class="switch-btn" onclick="nextCombo()">🔄 Sıradaki Sunucuya Geç</button>
            <div id="status" class="status">Sunucu Hazır</div>
        </div>
    </header>

    <div class="player-container">
        <div class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('live')">Canlı TV</button>
                <button class="tab-btn" onclick="switchTab('movies')">Filmler</button>
                <button class="tab-btn" onclick="switchTab('series')">Diziler</button>
            </div>
            <div id="channel-list" class="channel-list"></div>
        </div>

        <div class="main-player">
            <div class="info-bar" id="current-stream-info">Bir kanal seçin veya sunucu değiştirin.</div>
            <video id="video" controls autoplay></video>
        </div>
    </div>

    <script>
        const DOMAINS = [
            "tekno072.xyz:2095", "vip-flying.xyz:2095", "mrtrb.xyz:2095", "4kblue8k.xyz:2095",
            "maxgoldx.xyz:2095", "ediztv.yeninesiltv.org:2095", "euteck.xyz:2095", "xx1907xx.mysynology.net:2095",
            "globalvip.yeninesiltv.live:2095", "4kx8k.xyz:2095", "dzcvip1.xyz:2095", "vip2fun.xyz:2095",
            "eurvip.xyz:2095", "frkavrptv.com:2095", "germanyblue.site:8080", "erolelektronik.store:8080",
            "isktv10.com:2095", "iptvturkie.xyz:8080", "izmiruydu.xyz:2095", "ikrtvnew.com:2095",
            "ward2026.store:8080", "ctn34.xyz:8080", "dpsmartone.xyz:2095", "eagleblue.store:2095"
        ];

        const ACCOUNTS = [
            { username: "1879387Tobias", password: "d87a6d553670afb6" },
            { username: "efeece", password: "jYaK4ad" },
            { username: "Marvin.", password: "fzAT3ebxRZ" },
            { username: "Meral.keh", password: "y4k61BsQ5G" },
            { username: "GurEyup5858", password: "pF1zg8n2" }
        ];

        // Tüm Kombinasyon Dizisi
        let combos = [];
        DOMAINS.forEach(domain => {
            ACCOUNTS.forEach(acc => {
                combos.push({ domain, acc });
            });
        });

        let currentComboIndex = 0;
        let selectedStreamId = 'trt1';
        let hls = null;

        const channels = {
            live: [
                { name: "TRT 1 HD", id: "trt1" },
                { name: "ATV HD", id: "atv" },
                { name: "Kanal D HD", id: "kanald" },
                { name: "TV8 HD", id: "tv8" },
                { name: "Show TV HD", id: "showtv" },
                { name: "BeIN Sports 1", id: "bs1" }
            ],
            movies: [{ name: "Aksiyon Filmi", id: "movie1" }],
            series: [{ name: "Yerli Dizi S01E01", id: "series1" }]
        };

        let currentCategory = 'live';

        document.addEventListener("DOMContentLoaded", () => {
            renderChannels();
            updateStatus();
        });

        function updateStatus() {
            const current = combos[currentComboIndex];
            document.getElementById("status").textContent = `Deneniyor (${currentComboIndex + 1}/${combos.length}): ${current.domain}`;
        }

        function nextCombo() {
            currentComboIndex = (currentComboIndex + 1) % combos.length;
            updateStatus();
            if (selectedStreamId) {
                playStream(selectedStreamId);
            }
        }

        function renderChannels() {
            const container = document.getElementById("channel-list");
            container.innerHTML = "";
            const items = channels[currentCategory] || [];
            items.forEach(ch => {
                const div = document.createElement("div");
                div.className = "channel-item";
                div.textContent = ch.name;
                div.onclick = () => {
                    selectedStreamId = ch.id;
                    playStream(ch.id);
                };
                container.appendChild(div);
            });
        }

        function switchTab(type) {
            currentCategory = type;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderChannels();
        }

        function playStream(streamId) {
            const video = document.getElementById('video');
            const current = combos[currentComboIndex];
            const streamUrl = `http://${current.domain}/live/${current.acc.username}/${current.acc.password}/${streamId}.m3u8`;

            document.getElementById("current-stream-info").textContent = `Bağlanılıyor: ${current.domain} | Kullanıcı: ${current.acc.username}`;

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({
                    manifestLoadingTimeOut: 3000,
                    fragLoadingTimeOut: 3000
                });
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                    document.getElementById("current-stream-info").textContent = `Yayında: ${current.domain}`;
                });

                // Oynatıcı hata alırsa takılmadan otomatik sıradakine geç
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        document.getElementById("current-stream-info").textContent = `Sunucu yanıt vermedi. Sıradaki deneniyor... (${currentComboIndex + 1}/${combos.length})`;
                        setTimeout(() => {
                            nextCombo();
                        }, 1000);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play();
            }
        }
    </script>
</body>
</html>
